p: &p
  type: http
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 1800
  proxy: 订阅更新

proxy-providers:
  __PROVIDER_NAME__:
    <<: *p
    interval: 86400
    path: ./proxy_providers/1.yaml
    url: "__PROVIDER_URL__"

  __ONE_TIME_PROVIDER_NAME__:
    <<: *p
    path: ./proxy_providers/2.yaml
    url: "__ONE_TIME_PROVIDER_URL__"

mixed-port: 7890
ipv6: false
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: silent
find-process-mode: off

external-controller: 0.0.0.0:9090
external-ui: WebUI
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
secret: "__YOUR_SECRET__"

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 5228, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

tun:
  enable: true
  stack: system
  device: Meta
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true

hosts:
  dns.alidns.com: [223.5.5.5, 223.6.6.6]
  doh.pub: [1.12.12.12, 120.53.53.53]
  cloudflare-dns.com: [1.1.1.1, 1.0.0.1]
  dns.google: [8.8.8.8, 8.8.4.4]

dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter:
    - "rule-set:private_domain,fcm_domain,cn_domain,custom_direct"
  proxy-server-nameserver: &direct_dns
    - https://dns.alidns.com/dns-query#DIRECT&h3=true
    - https://doh.pub/dns-query#DIRECT&h3=false
  nameserver-policy:
    "rule-set:private_domain,fcm_domain,cn_domain,custom_direct": *direct_dns
  nameserver:
    - https://cloudflare-dns.com/dns-query#节点选择
    - https://dns.google/dns-query#节点选择

proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 美国节点
      - 日本节点
      - 狮城节点

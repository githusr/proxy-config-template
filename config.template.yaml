rules:
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((OR,((RULE-SET,cn_domain),(RULE-SET,cn_ip,no-resolve),(RULE-SET,private_domain),(RULE-SET,private_ip,no-resolve),(RULE-SET,custom_direct,no-resolve)))))),QUIC
  - RULE-SET,special_address,特殊地址,no-resolve
  - RULE-SET,custom_direct,DIRECT,no-resolve
  - RULE-SET,custom_proxy,节点选择,no-resolve
  - RULE-SET,ads_domain,广告拦截
  - RULE-SET,private_domain,DIRECT
  - RULE-SET,bilibili_domain,哔哩哔哩
  - RULE-SET,tiktok_domain,TikTok
  - RULE-SET,steam_domain,游戏平台
  - RULE-SET,fcm_domain,谷歌FCM
  - RULE-SET,google_domain,Google
  - DOMAIN-SUFFIX,dl.delivery.mp.microsoft.com,DIRECT
  - DOMAIN-SUFFIX,windowsupdate.com,DIRECT
  - RULE-SET,microsoft_domain,微软服务
  - RULE-SET,apple_domain,苹果服务
  - RULE-SET,porn_domain,PORN
  - RULE-SET,geolocation_not_cn,节点选择
  - RULE-SET,cn_domain,DIRECT

  - RULE-SET,private_ip,DIRECT
  - RULE-SET,bilibili_ip,哔哩哔哩
  - RULE-SET,google_ip,Google
  - RULE-SET,apple_ip,苹果服务
  - RULE-SET,cn_ip,DIRECT
  - MATCH,漏网之鱼

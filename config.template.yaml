rule-anchor:
  classical: &classical
    type: http
    behavior: classical
    format: text
    interval: 86400
    proxy: 节点选择

  ip: &ip
    type: http
    behavior: ipcidr
    format: mrs
    interval: 86400
    proxy: 节点选择

  domain: &domain
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    proxy: 节点选择

rule-providers:
  special_address:
    <<: *classical
    path: ./rule_providers/special_address.list
    url: "__SPECIAL_ADDRESS_URL__"

  custom_direct:
    <<: *classical
    path: ./rule_providers/custom_direct.list
    url: "__CUSTOM_DIRECT_URL__"
  custom_proxy:
    <<: *classical
    path: ./rule_providers/custom_proxy.list
    url: "__CUSTOM_PROXY_URL__"

  ads_domain:
    <<: *domain
    path: ./rule_providers/ads_domain.mrs
    url: "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash.mrs"

  private_domain:
    <<: *domain
    path: ./rule_providers/private_domain.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"
  private_ip:
    <<: *ip
    path: ./rule_providers/private_ip.mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"

  bilibili_domain:
